<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <!-- Tema (2.20.0): dipasang sebelum CSS dimuat supaya halaman tak berkedip terang dulu.
       Pilihan per browser (pt2_tema: sistem, terang, gelap); app.js mengurus sisanya. -->
  <script>
    (function () {
      var p = 'sistem';
      try { p = JSON.parse(localStorage.getItem('pt2_tema')) || 'sistem'; } catch (e) { /* diblokir atau rusak */ }
      var gelap = p === 'gelap' || (p !== 'terang' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-tema', gelap ? 'gelap' : 'terang');
      if (gelap) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171C23');
      // Tampilan pribadi terakhir di browser ini (2.21.0): warna aksen, kepadatan, ukuran huruf.
      try {
        var t = JSON.parse(localStorage.getItem('pt2_tampilan_awal')) || {};
        var akar = document.documentElement;
        if (t.padat) akar.setAttribute('data-padat', String(t.padat));
        if (t.huruf) akar.setAttribute('data-huruf', String(t.huruf));
        if (typeof t.css === 'string' && t.css) {
          var gaya = document.createElement('style');
          gaya.id = 'gaya-aksen';
          gaya.textContent = t.css;
          document.head.appendChild(gaya);
        }
      } catch (e) { /* diblokir atau rusak: tampilan bawaan */ }
    })();
  </script>
  <title>ProductTrack v2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/logo/icon-32.png">
  <link rel="apple-touch-icon" href="/logo/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ?v= = versi package.json (dijaga tes berkas): browser atau proxy tak bisa mencampur berkas lama dan baru. -->
  <link rel="stylesheet" href="/app.css?v=2.21.0">
</head>
<body>

  <!-- Wallpaper pribadi (2.21.0): lapisan di belakang semua isi, diatur app.js. -->
  <div id="latar" aria-hidden="true"></div>

  <!-- Layar kunci: PIN server bersama -->
  <div id="kunci" class="layar">
    <form id="form-kunci" class="kartu-layar" autocomplete="off">
      <span class="merek">
        <span class="merek-ikon"><img src="/logo/icon-64.png" alt="" width="26" height="26" draggable="false"></span>
        <span class="merek-nama">Product<b>Track</b></span>
      </span>
      <p id="kunci-pesan" class="pesan-info">Memeriksa sesi…</p>
      <label id="kunci-isian" class="isian" hidden>
        PIN
        <input id="kunci-pin" class="kunci-input" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64" required>
      </label>
      <p id="kunci-galat" class="pesan-galat" role="alert" hidden></p>
      <button id="kunci-tombol" class="tombol utama lebar" hidden>Masuk</button>
      <!-- PIN sudah benar tapi data gagal dimuat: jangan tampilkan isian PIN lagi, supaya
           tak terbaca sebagai "PIN salah". -->
      <button id="kunci-ulang" type="button" class="tombol utama lebar" data-aksi="coba-muat" hidden>Coba lagi</button>
      <!-- Hanya saat data di browser ini gagal disiapkan: jalan keluar tanpa membuka DevTools. -->
      <button id="kunci-reset" type="button" class="tombol lebar" data-aksi="reset-lokal" hidden>Reset data contoh di browser ini</button>
    </form>
  </div>

  <!-- Pilih profil: dengan PIN bersama, peran dipilih sendiri -->
  <div id="profil" class="layar" hidden></div>

  <!-- Kerangka seperti v1: sidebar kiri (laci di ponsel) + isi halaman. -->
  <div id="app" class="kerangka" hidden>
    <aside id="samping" class="samping" aria-label="Navigasi"></aside>
    <div id="samping-latar" class="samping-latar" data-aksi="tutup-nav" hidden></div>
    <div class="wadah-isi">
      <header class="kepala" id="kepala"></header>
      <main id="isi" class="isi"></main>
    </div>
    <nav class="nav-bawah" id="nav-bawah" aria-label="Menu cepat"></nav>
    <button type="button" class="fab" id="fab" data-aksi="tambah-task" aria-label="Tambah task" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Langkah panduan yang sedang dicoba (lihat panduan.js). Sengaja sesudah #app: tersembunyi
       bersamanya di layar PIN dan pilih profil. -->
  <aside id="pemandu" class="pemandu" aria-label="Langkah panduan" hidden></aside>

  <div id="laci" class="laci" hidden>
    <div class="laci-latar" data-aksi="tutup-detail"></div>
    <aside class="laci-panel" id="laci-panel" aria-label="Detail task"></aside>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="laci-latar" data-aksi="tutup-modal"></div>
    <div class="modal-panel" id="modal-panel" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast-wadah" aria-live="polite"></div>

  <script src="/inti.js?v=2.21.0"></script>
  <script src="/panduan.js?v=2.21.0"></script>
  <script src="/app.js?v=2.21.0"></script>
</body>
</html>
