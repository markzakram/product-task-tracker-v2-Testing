const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const daysUntil = s => s ? Math.round((parseD(s) - today0()) / DAY) : Infinity;
const fmtD = s => s ? parseD(s).toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) : '—';

const rel = t => {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'baru saja';
  if (s < 3600) return `${Math.floor(s / 60)} mnt lalu`;
  if (s < 86400) return `${Math.floor(s / 3600)} jam lalu`;
  if (s < 604800) return `${Math.floor(s / 86400)} hari lalu`;
  return fmtDT(t);
};

async function hashPin(pin) {
  const input = 'productrack-v2:' + pin;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch {
    let h = 5381; for (const c of input) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
    return 'djb2-' + h.toString(16);
  }
}
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n');
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

/* Role & permission */
function can(action, t) {
  const u = me(), r = myRole();
  if (r === 'manager') return true;
  const own = t && (t.pic === u || (t.support || []).includes(u));
  const leadsIt = t && r === 'lead' && (t.pic === u || person(t.pic).lead === u || t.assignedBy === u);
  switch (action) {
    case 'work': return !!(own || leadsIt);
    case 'edit': return !!leadsIt;
    case 'distribute': return !!leadsIt;
    case 'delete': return r === 'lead' && t.assignedBy === u;
    case 'approve': return gateReviewer(t) === u;
    case 'create': return r === 'lead';

  }
}

function setStatus(t, s) {
  if (t.status === s) return true;
  if (!can('work', t)) return deny('Hanya PIC, support, Lead, atau Manager yang bisa mengubah status task ini');
  if (!statusesFor(t).includes(s)) return deny(`Status "${s}" tidak berlaku untuk ${isLCI(t) ? 'pipeline Learning Content Implementation' : 'task umum'}`);
  if (GATE_REQUIRED.includes(s) && t.gate !== 'Lolos') return deny(`Task hanya bisa "${s}" setelah output lolos Gate. Gunakan "Ajukan ke Gate".`);
  if (['In Progress', 'Input'].includes(s) && unmetDeps(t).length) return deny(`Dependency belum selesai: ${unmetDeps(t).map(d => d.id).join(', ')}`);
  const patch = { status: s };
  if (t.gate === 'Lolos' && !GATE_REQUIRED.includes(s) && !(isLCI(t) && LCI_GATE_READY.includes(s))) patch.gate = 'Belum';
  if (t.gate === 'Diajukan' && s !== 'Review' && !isLCI(t)) patch.gate = 'Belum';
  const prev = t.status;
  updateTask(t.id, patch, `Status: ${prev} → ${s}${patch.gate === 'Belum' ? ' (gate direset)' : ''}`);
  return true;
}

/* ---------- DASHBOARD MONITORING ---------- */
function workloadRows(ids) {
  return ids.map(id => {
    const tasks = state.tasks.filter(t => t.pic === id && !isDone(t));
    const subs = state.tasks.flatMap(t => isDone(t) ? [] : t.subtasks.filter(s => s.pic === id && s.status !== 'Done'));
    const sup = state.tasks.filter(t => !isDone(t) && t.support.includes(id)).length;
    const overdue = tasks.filter(isOverdue).length + subs.filter(subOverdue).length;
    return { id, tasks: tasks.length, subs: subs.length, sup, load: tasks.length + subs.length, overdue, doing: tasks.filter(t => ['In Progress', 'Input', 'QC', 'Revision'].includes(t.status)) };
  });
}
function bottlenecks() {
  return PEOPLE.map(p => {
    const waiting = state.tasks.filter(t => !isDone(t) && unmetDeps(t).some(d => d.pic === p.id));
    const gates = state.tasks.filter(t => t.gate === 'Diajukan' && gateReviewer(t) === p.id);
    const overdue = state.tasks.filter(t => t.pic === p.id && isOverdue(t));
    return { id: p.id, waiting, gates, overdue, score: waiting.length * 2 + gates.length * 2 + overdue.length };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
}
function workloadCard(ids, title = 'Workload per Orang') {
  const rows = workloadRows(ids);
  const cap = state.settings.capacity;
  const max = Math.max(cap, ...rows.map(r => r.load));
  return card(`${cardHead(title, 'groups', `<div class="flex items-center gap-3 text-xs text-slate-500"><span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm bg-blue-600"></i>Task</span><span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm bg-sky-300"></i>Sub-task</span><span class="flex items-center gap-1"><i class="w-0.5 h-3 bg-rose-500"></i>Kapasitas ${cap}</span></div>`)}
    <div class="px-5 pb-5 space-y-3">${rows.map(r => {
      const over = r.load > cap;
      return `<button data-act="filter-pic" data-v="${r.id}" class="w-full flex items-center gap-3 text-left group">
        ${avatar(r.id, 'w-8 h-8 text-xs')}
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2 text-sm mb-1">
            <span class="font-medium text-slate-700 truncate group-hover:text-blue-600">${esc(pname(r.id))} <span class="text-xs font-normal text-slate-400">${esc(person(r.id).title)}</span></span>
            <span class="text-xs text-slate-500 tabular-nums whitespace-nowrap"><b class="${over ? 'text-rose-600' : 'text-slate-800'}">${r.load}</b>${r.sup ? ` · ${r.sup} support` : ''}${r.overdue ? ` · <span class="text-rose-600 font-semibold">${r.overdue} overdue</span>` : ''}</span>
          </div>
          <div class="relative h-2.5 rounded-full bg-slate-100 flex overflow-hidden">
            <div class="bg-blue-600" style="width:${r.tasks / max * 100}%"></div><div class="bg-sky-300" style="width:${r.subs / max * 100}%"></div>
            <div class="absolute top-0 bottom-0 w-0.5 bg-rose-500" style="left:${cap / max * 100}%"></div>
          </div>
        </div>
      </button>`;
    }).join('')}</div>`);
}

/* ---------- SEMUA TASK ---------- */
function statusMatch(t, s) {
  if (!s) return true;
  if (s === '__active') return !isDone(t);
  if (s === '__overdue') return isOverdue(t);
  if (s === '__stuck') return stuckReasons(t).length > 0;
  if (s === '__gate') return t.gate === 'Diajukan' || t.gate === 'Ditolak' || (!isDone(t) && t.gate === 'Belum' && ['Review', 'Approved', 'Ready to Publish'].includes(t.status));
  return t.status === s;
}
function filteredTasks() {
  const f = state.ui.f, q = f.q.trim().toLowerCase();
  return state.tasks.filter(t =>
    (!q || [t.id, t.title, pname(t.pic), t.platform, t.sub, t.detail, t.status, pjName(t.project), t.output].join(' ').toLowerCase().includes(q)) &&
    (!f.project || t.project === f.project) && (!f.stage || t.stage === f.stage) && statusMatch(t, f.status) &&
    (!f.pic || involves(t, f.pic)) && (!f.platform || t.platform === f.platform) && (!f.rumpun || rumpunOf(t.platform) === f.rumpun) &&
    (!f.priority || t.priority === f.priority) && (!f.issue || (f.issue === '__any' ? !!t.issue : t.issue === f.issue)) && (!f.mine || involves(t, me())));
}
VIEWS.tasks = () => {

  const statusOpts = `<option value="">Semua status</option>${[['__active', 'Semua aktif'], ['__overdue', 'Overdue'], ['__stuck', 'Tertahan'], ['__gate', 'Belum lolos gate']].map(([k, l]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${l}</option>`).join('')}
    <optgroup label="Status umum">${GEN_STATUS.map(s => `<option ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}</optgroup>
    <optgroup label="Pipeline LCI">${LCI_STATUS.filter(s => s !== 'Revision').map(s => `<option ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}</optgroup>`;
  const sel = (key, inner) => `<select data-filter="${key}" class="${selectCls} ${f[key] ? 'border-blue-400 bg-blue-50/50' : ''}">${inner}</select>`;
  return `
  <div class="flex flex-wrap items-center gap-3 mb-3">
    ${seg(vb('table', 'table_rows', 'Tabel') + vb('kanban', 'view_kanban', 'Kanban') + vb('timeline', 'view_timeline', 'Timeline'))}
    ${v === 'kanban' ? `<label class="flex items-center gap-2 text-sm text-slate-600">Kelompokkan <select data-ui="kanbanBy" class="${selectCls}">${opts(['stage', 'status', 'lci'], state.ui.kanbanBy, null, x => ({ stage: 'Stage ADDIE', status: 'Status umum', lci: 'Pipeline LCI (Input & QC)' })[x])}</select></label>` : ''}
    <label class="inline-flex items-center gap-2 text-sm text-slate-600 bg-white border border-slate-200 rounded-xl px-3 py-2 cursor-pointer"><input type="checkbox" data-filter-check="mine" ${f.mine ? 'checked' : ''} class="accent-blue-600" /> Melibatkan saya</label>
  </div>
  <div class="flex flex-wrap items-center gap-2 mb-5">
    <label class="relative flex-1 min-w-[200px]">${icon('search', 'absolute left-3 top-1/2 -translate-y-1/2 text-slate-400', 18)}<input data-filter="q" value="${esc(f.q)}" type="search" placeholder="Cari ID, task, output…" class="${inputCls} pl-9" /></label>
    ${sel('project', opts(state.projects.map(p => p.id), f.project, 'Semua proyek', id => pjName(id)))}
    ${sel('stage', opts(STAGES.map(s => s.id), f.stage, 'Semua stage', id => `${STAGE[id].no}. ${STAGE[id].name}`))}
    ${sel('status', statusOpts)}
    ${sel('pic', peopleOpts(PEOPLE.map(p => p.id), f.pic, 'Semua orang'))}
    ${sel('rumpun', opts(state.settings.rumpun.map(r => r.name), f.rumpun, 'Semua rumpun'))}
    ${sel('platform', opts(platforms(), f.platform, 'Semua platform'))}
    ${sel('priority', opts(PRIORITIES, f.priority, 'Semua priority'))}
    ${sel('issue', `<option value="">Issue: semua</option><option value="__any" ${f.issue === '__any' ? 'selected' : ''}>Hanya issue</option>${ISSUES.map(i => `<option ${f.issue === i ? 'selected' : ''}>${i}</option>`).join('')}`)}
    <button data-act="filter-reset" title="Reset filter" class="w-10 h-10 grid place-items-center rounded-xl border border-slate-200 bg-white text-slate-500 hover:text-slate-800">${icon('filter_alt_off', '', 18)}</button>
  </div>
  <div id="task-body">${taskBody()}</div>`;
};
function taskBody() {
  const list = filteredTasks();
  const head = `<p class="text-xs text-slate-500 mb-3">${list.length} dari ${state.tasks.length} task</p>`;
  if (state.ui.taskView === 'kanban') return head + kanbanView(list);
  if (state.ui.taskView === 'timeline') return head + timelineView(list);
  return head + tableView(list);
}
function renderTaskBody() { const el = $('#task-body'); if (el) el.innerHTML = taskBody(); }

function tableView(list) {
  if (!list.length) return card(empty('search_off', 'Tidak ada task yang cocok', 'Ubah kata kunci atau reset filter.'));
  const { key, dir } = state.ui.sort;
  const val = t => key === 'status' ? statusesFor(t).indexOf(t.status) : key === 'stage' ? STAGE[t.stage].no : key === 'priority' ? PRIORITIES.indexOf(t.priority) : key === 'pic' ? pname(t.pic) : key === 'progress' ? progressOf(t) : String(t[key] || (key === 'due' ? '9999' : '')).toLowerCase();
  const sorted = [...list].sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
  const th = (k, l) => `<th class="px-3 py-3 text-left font-medium"><button data-act="sort" data-key="${k}" class="inline-flex items-center gap-1 uppercase tracking-wide hover:text-slate-800">${l}${key === k ? icon(dir > 0 ? 'arrow_upward' : 'arrow_downward', '', 14) : ''}</button></th>`;
  return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"><div class="overflow-x-auto">
    <table class="w-full text-sm min-w-[1180px]">
      <thead class="bg-slate-50 text-slate-500 text-xs"><tr>${th('id', 'ID')}${th('title', 'Task')}${th('stage', 'ADDIE')}${th('pic', 'PIC · Support')}${th('priority', 'Priority')}${th('status', 'Status')}<th class="px-3 py-3 text-left font-medium uppercase tracking-wide">Gate</th>${th('due', 'Deadline')}${th('progress', 'Progress')}</tr></thead>
      <tbody class="divide-y divide-slate-100">${sorted.map(t => `
        <tr data-act="open-task" data-id="${t.id}" class="cursor-pointer hover:bg-blue-50/50 ${state.ui.drawerId === t.id ? 'bg-blue-50/70' : ''}">
          <td class="px-3 py-3 font-mono text-xs text-slate-500 whitespace-nowrap">${t.id}</td>
          <td class="px-3 py-3 max-w-[360px]">
            <p class="font-medium text-slate-800 truncate">${esc(t.title)}</p>
            <p class="text-xs text-slate-400 truncate flex items-center gap-1.5">${issueChip(t.issue)}${isBlocked(t) ? `<span class="text-violet-600">${icon('block', '', 13)}</span>` : ''}${esc(t.platform)} · ${esc(pjName(t.project))}</p>
          </td>
          <td class="px-3 py-3"><div class="flex flex-col items-start gap-0.5">${stageChip(t.stage)}<span class="text-[11px] text-slate-500 truncate max-w-[180px]">${esc(t.sub)}</span></div></td>
          <td class="px-3 py-3"><div class="flex items-center gap-2">${avatar(t.pic)}<span class="text-slate-700 whitespace-nowrap">${esc(pname(t.pic))}</span>${t.support.length ? avatars(t.support, 'w-5 h-5 text-[9px]') : ''}</div></td>
          <td class="px-3 py-3">${prioBadge(t.priority)}</td>
          <td class="px-3 py-3">${badge(t.status)}</td>
          <td class="px-3 py-3">${gateBadge(t.gate)}</td>
          <td class="px-3 py-3">${tDue(t)}</td>
          <td class="px-3 py-3">${progressBar(progressOf(t), t.subtasks.length ? `${t.subtasks.filter(s => s.status === 'Done').length}/${t.subtasks.length}` : null)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>`;
}

function kanbanView(list) {
  const by = state.ui.kanbanBy;
  const kcard = (t, drag) => `
    <div ${drag ? `draggable="true" data-drag-id="${t.id}"` : ''} data-act="open-task" data-id="${t.id}" class="bg-white rounded-xl border ${isOverdue(t) ? 'border-rose-200' : 'border-slate-200'} p-3 shadow-sm hover:shadow-md hover:border-blue-300 ${drag ? 'cursor-grab active:cursor-grabbing' : 'cursor-pointer'} transition">
      <div class="flex flex-wrap items-center gap-1 mb-1.5"><span class="font-mono text-[10px] text-slate-400">${t.id}</span>${by !== 'stage' ? stageChip(t.stage) : ''}${issueChip(t.issue)}<span class="ml-auto">${prioBadge(t.priority)}</span></div>

function timelineView(list) {
  if (!list.length) return card(empty('view_timeline', 'Tidak ada task untuk ditampilkan'));
  const DAYS = 56, COL = 32, todayIdx = 14;
  const start = new Date(today0().getTime() - todayIdx * DAY);
  const idx = s => Math.round((parseD(s) - start) / DAY);
  const days = Array.from({ length: DAYS }, (_, i) => new Date(start.getTime() + i * DAY));
  const width = DAYS * COL;
  const sorted = [...list].sort((a, b) => STAGE[a.stage].no - STAGE[b.stage].no || (a.start || '').localeCompare(b.start || ''));
  const header = days.map((d, i) => `<div class="shrink-0 text-center border-l border-slate-100 ${i === todayIdx ? 'bg-blue-50' : d.getDay() % 6 === 0 ? 'bg-slate-50' : ''}" style="width:${COL}px">
      <div class="h-5 text-[10px] font-semibold text-slate-500 text-left pl-1 whitespace-nowrap">${i === 0 || d.getDate() === 1 ? d.toLocaleDateString('id-ID', { month: 'short' }) : ''}</div>
      <div class="text-[11px] ${i === todayIdx ? 'text-blue-600 font-bold' : 'text-slate-500'}">${d.getDate()}</div>
      <div class="text-[9px] text-slate-400">${'MSSRKJS'[d.getDay()]}</div></div>`).join('');
  const rows = sorted.map(t => {
    let s = idx(t.start || t.due), e = idx(t.due || t.start);
    if (e < s) [s, e] = [e, s];
    const cs = Math.max(0, s), ce = Math.min(DAYS - 1, e), hex = STAGE[t.stage].hex;
    const bar = ce >= cs ? `<div data-act="open-task" data-id="${t.id}" title="${esc(t.title)} · ${fmtD(t.start)} – ${fmtD(t.due)}" class="absolute top-2 h-7 rounded-lg flex items-center gap-1.5 text-[11px] font-medium text-white shadow-sm cursor-pointer hover:brightness-110 overflow-hidden ${isOverdue(t) ? 'ring-2 ring-rose-400 ring-offset-1' : ''}" style="left:${cs * COL + 2}px;width:${(ce - cs + 1) * COL - 4}px;background:${hex}66">
        <div class="absolute inset-y-0 left-0" style="width:${progressOf(t)}%;background:${hex}"></div>
        <span class="relative px-2 truncate">${esc(pname(t.pic))} · ${progressOf(t)}%</span></div>`
      : `<div class="absolute top-3 ${e < 0 ? 'left-2' : 'right-2'} text-[11px] text-slate-400 flex items-center">${icon(e < 0 ? 'west' : 'east', '', 14)} ${fmtD(t.due)}</div>`;
    return `<div class="flex border-t border-slate-100 hover:bg-slate-50/60">
      <div data-act="open-task" data-id="${t.id}" class="sticky left-0 z-10 bg-white w-56 sm:w-72 shrink-0 px-4 py-2 border-r border-slate-200 cursor-pointer hover:text-blue-600">
        <p class="text-sm font-medium truncate"><span class="font-mono text-[10px] text-slate-400">${t.id}</span> ${esc(t.title)}</p>
        <p class="text-[11px] truncate" style="color:${hex}">${STAGE[t.stage].name} · <span class="text-slate-400">${t.status}</span></p>
      </div>
      <div class="relative shrink-0 h-11" style="width:${width}px">${bar}</div>
    </div>`;
  }).join('');
  const bg = days.map((d, i) => `<div class="absolute top-0 bottom-0 border-l border-slate-100 ${d.getDay() % 6 === 0 ? 'tl-weekend' : ''}" style="left:${i * COL}px;width:${COL}px"></div>`).join('');
  return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="flex flex-wrap items-center gap-3 px-4 py-3 border-b border-slate-100 text-xs text-slate-500">
      ${STAGES.map(s => `<span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded" style="background:${s.hex}"></i>${s.name}</span>`).join('')}
      <span class="ml-auto">Isi bar = progress · 2 minggu ke belakang, 6 minggu ke depan</span>
    </div>
    <div class="overflow-x-auto"><div style="min-width:${width + 288}px">
      <div class="flex sticky top-0 bg-white z-20 border-b border-slate-200">
        <div class="sticky left-0 z-10 bg-white w-56 sm:w-72 shrink-0 px-4 py-2 border-r border-slate-200 text-xs font-semibold uppercase tracking-wide text-slate-500 flex items-end">Task</div>
        <div class="flex">${header}</div>
      </div>
      <div class="relative">
        <div class="absolute inset-y-0 left-56 sm:left-72 pointer-events-none" style="width:${width}px">${bg}<div class="absolute top-0 bottom-0 w-0.5 bg-blue-600/70 z-10" style="left:${todayIdx * COL + COL / 2}px"></div></div>
        <div class="relative">${rows}</div>
      </div>
    </div></div>
  </div>`;
}

function openDrawer(id) {
  if (!getTask(id)) return;
  state.ui.drawerId = id;
  renderDrawer();
  $('#drawer').classList.remove('translate-x-full');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#drawer-backdrop').classList.remove('hidden');
  if (state.ui.view === 'tasks') renderTaskBody();
}
function closeDrawer() {
  state.ui.drawerId = null;
  $('#drawer').classList.add('translate-x-full');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#drawer-backdrop').classList.add('hidden');
  if (state.ui.view === 'tasks') renderTaskBody();
}
function renderDrawer() {
  const t = getTask(state.ui.drawerId);
  if (!t) { closeDrawer(); return; }
  const E = can('edit', t), W = can('work', t), D = can('distribute', t);
  const dis = ok => ok ? '' : 'disabled';
  const sel = (f, list, ok, labelFn) => `<select data-field="${f}" ${dis(ok)} class="w-full rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none">${opts(withCur(list, t[f]), t[f], null, labelFn)}</select>`;
  const meta = (label, ic, control) => `<div><p class="flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-slate-400 mb-1">${icon(ic, '', 14)}${label}</p>${control}</div>`;
  const statusSel = `<select data-status ${dis(W)} class="w-full rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm focus:border-blue-500 outline-none">${statusesFor(t).map(s => `<option value="${s}" ${s === t.status ? 'selected' : ''} ${GATE_REQUIRED.includes(s) && t.gate !== 'Lolos' ? 'disabled' : ''}>${s}${GATE_REQUIRED.includes(s) && t.gate !== 'Lolos' ? ' (butuh gate)' : ''}</option>`).join('')}</select>`;
  const checks = gateChecks(t), canSubmit = checks.every(c => c.ok);
  const reviewer = gateReviewer(t), R = can('approve', t);
  const rdeps = state.tasks.filter(x => x.deps.includes(t.id));
  const depCandidates = state.tasks.filter(x => x.id !== t.id && !t.deps.includes(x.id) && !wouldCycle(t.id, x.id));
  const subPics = myRole() === 'manager' ? PEOPLE.map(p => p.id) : [...new Set([t.pic, ...teamOf(leadOf(t.pic) || t.pic).map(p => p.id), ...(myRole() === 'lead' ? [me(), ...teamOf(me()).map(p => p.id)] : [])])];
  const p = getProject(t.project);

  $('#drawer-body').innerHTML = `
    <div class="px-5 sm:px-6 py-4 border-b border-slate-100 flex items-start gap-3">
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-center gap-2 mb-1.5"><span class="font-mono text-xs text-slate-500 bg-slate-100 rounded px-1.5 py-0.5">${t.id}</span>${stageChip(t.stage)}${badge(t.status)}${gateBadge(t.gate)}${issueChip(t.issue)}${isOverdue(t) ? chip(`Telat ${-daysUntil(t.due)} hari`, 'bg-rose-50 text-rose-700') : ''}</div>
        <textarea data-field="title" rows="1" ${dis(E)} class="w-full text-lg font-semibold text-slate-900 leading-snug resize-none outline-none bg-transparent disabled:bg-transparent disabled:text-slate-900 disabled:cursor-default" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(t.title)}</textarea>
        <p class="text-xs text-slate-400">${esc(p?.name || '—')} · didelegasikan ${esc(pname(t.assignedBy))} → ${esc(pname(t.pic))} · diperbarui ${rel(t.updatedAt)}</p>
      </div>
      ${can('delete', t) ? `<button data-act="delete-task" data-id="${t.id}" title="Hapus" class="w-9 h-9 grid place-items-center rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600">${icon('delete', '', 20)}</button>` : ''}
      <button data-act="close-drawer" title="Tutup (Esc)" class="w-9 h-9 grid place-items-center rounded-lg text-slate-500 hover:bg-slate-100">${icon('close', '', 20)}</button>
    </div>

          <p class="font-semibold text-slate-900 flex items-center gap-2">${icon('rule', '', 20)}Gate ${STAGE[t.stage].name}</p>
          ${gateBadge(t.gate)}
          <span class="text-xs text-slate-500 ml-auto flex items-center gap-1">Reviewer ${avatar(reviewer, 'w-5 h-5 text-[9px] ring-0')} ${esc(pname(reviewer))}</span>

      </div>
    </div>

    <form data-form="comment" class="border-t border-slate-200 p-4 flex items-end gap-2 bg-white">

    </form>`;
  const ta = $('#drawer-body textarea[data-field=title]');
  requestAnimationFrame(() => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
}
function wouldCycle(taskId, depId) {
  const seen = new Set(), stack = [depId];
  while (stack.length) {
    const id = stack.pop();
    if (id === taskId) return true;
    if (seen.has(id)) continue;
    seen.add(id);
    (getTask(id)?.deps || []).forEach(d => stack.push(d));
  }
  return false;
}

  }, r === 'manager' ? 'Delegasikan' : 'Buat Task');

function distributeModal(t) {
  if (!can('distribute', t)) return deny();
  const lead = leadOf(t.pic) || me();
  const team = teamOf(lead);
  const rows = (team.length ? team : [person(t.pic)]).map((p, i) => `
    <div class="grid grid-cols-1 sm:grid-cols-[120px_1fr_140px] gap-2 items-center">
      <div class="flex items-center gap-2">${avatar(p.id, 'w-7 h-7 text-[10px]')}<div><p class="text-sm font-medium">${esc(p.short)}</p><p class="text-[10px] text-slate-500 leading-tight">${esc(p.title)}</p></div></div>
      <input type="hidden" name="pic${i}" value="${p.id}" />
      <input name="title${i}" maxlength="140" placeholder="Sub-task untuk ${esc(p.short)} (kosongkan jika tidak ada)" class="${inputCls}" />
      <input name="due${i}" type="date" value="${esc(t.due)}" class="${inputCls}" />
    </div>`).join('');
  openModal(`Distribusikan ${t.id} ke Staff`, `
    <div class="rounded-xl bg-slate-50 p-3"><p class="text-sm font-medium text-slate-800">${esc(t.title)}</p><p class="text-xs text-slate-500 mt-0.5">${STAGE[t.stage].name} · ${esc(t.sub)} · deadline ${fmtD(t.due)}</p></div>
    <div class="space-y-3">${rows}</div>
    <p class="text-xs text-slate-500">Progress task otomatis dihitung dari sub-task. Staff melihat sub-task di menu Hari Ini.</p>
  `, fd => {
    const n = (team.length || 1);
    const added = [];
    for (let i = 0; i < n; i++) {
      const title = String(fd.get('title' + i) || '').trim();
      if (!title) continue;
      const s = { id: uid(), title, pic: fd.get('pic' + i), due: fd.get('due' + i) || t.due, status: 'Todo' };
      t.subtasks.push(s); added.push(s);
    }
    if (!added.length) return deny('Isi minimal satu sub-task'), false;
    if (t.status === 'Backlog') t.status = 'Ready';
    updateTask(t.id, {}, `Distribusi ${added.length} sub-task: ${added.map(s => `${pname(s.pic)} (${s.title})`).join('; ')}`);
    toast(`${added.length} sub-task didistribusikan`);
  }, 'Distribusikan');
}

function gateModal(t, action) {
  const approve = action === 'approve';
  openModal(`${approve ? 'Loloskan' : 'Tolak'} Gate — ${t.id}`, `
    <div class="rounded-xl bg-slate-50 p-3"><p class="text-sm font-medium">${esc(t.title)}</p><p class="text-xs text-slate-500 mt-1"><b>Output:</b> ${esc(t.output)}</p><p class="text-xs text-slate-500">${t.evidence.map(e => `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">${esc(e.label)}</a>`).join(' · ')}</p></div>
    <ul class="text-xs text-slate-600 space-y-0.5">${STAGE[t.stage].gate.map(g => `<li>• ${esc(g)}</li>`).join('')}</ul>
    ${approve && t.stage === 'A' ? field('Keputusan produk', `<select name="decision" class="${selectCls} w-full">${opts(DECISIONS, t.decision || getProject(t.project)?.decision || 'Build')}</select>`) : ''}
    ${field(approve ? 'Catatan (opsional)' : 'Alasan penolakan (wajib)', `<textarea name="note" rows="3" ${approve ? '' : 'required'} maxlength="500" class="${inputCls} resize-none"></textarea>`)}
  `, fd => {
    const note = String(fd.get('note') || '').trim();
    if (!approve && !note) return false;
    t.gateLog.push({ id: uid(), by: me(), action: approve ? 'Lolos' : 'Ditolak', note, at: Date.now() });
    const patch = approve ? { gate: 'Lolos' } : { gate: 'Ditolak', status: 'Revision' };
    if (approve && !isLCI(t)) patch.status = 'Done';
    if (approve && t.stage === 'A' && fd.get('decision')) {
      patch.decision = fd.get('decision');
      const p = getProject(t.project); if (p) { p.decision = patch.decision; save('projects'); }
    }
    updateTask(t.id, patch, approve ? `Gate ${STAGE[t.stage].name} LOLOS${patch.decision ? ' · keputusan ' + patch.decision : ''}${note ? ' — ' + note : ''}` : `Gate ${STAGE[t.stage].name} DITOLAK — ${note}`, 'gate');
    toast(approve ? 'Output lolos gate' : 'Output dikembalikan untuk revisi', { icon: approve ? 'verified' : 'block' });
  }, approve ? 'Loloskan' : 'Tolak & kembalikan');
}

function addComment(id, text) {
  const t = getTask(id); text = String(text || '').trim();
  if (!t || !text) return false;
  t.comments.push({ id: uid(), author: me(), text, at: Date.now() });
  t.updatedAt = Date.now(); save('tasks');
  logAct('comment', tlabel(t), text.length > 80 ? text.slice(0, 80) + '…' : text);
  refresh();
  return true;
}
function importCSV(text, source) {
  if (myRole() !== 'manager') return deny('Hanya Manager yang dapat mengimpor data');
  const rows = parseCSV(text);
  if (rows.length < 2) return deny('CSV kosong');
  const head = rows[0].map(h => h.trim().toLowerCase().replace(/^﻿/, ''));
  const col = (...n) => head.findIndex(h => n.includes(h));
  const C = { id: col('task id', 'id'), title: col('nama task', 'judul', 'title', 'task'), project: col('proyek', 'project'), platform: col('platform'), stage: col('addie stage', 'stage'), sub: col('sub-stage', 'sub stage'), pic: col('pic utama', 'pic'), priority: col('priority'), start: col('start date', 'start', 'mulai'), due: col('deadline', 'due'), status: col('status'), output: col('output') };
  if (C.title < 0) return deny('Kolom "nama task" tidak ditemukan');
  const normDate = v => { v = String(v || '').trim(); if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const m = v.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; const d = new Date(v); return isNaN(d) ? '' : iso(d); };
  const findPerson = v => PEOPLE.find(p => [p.id, p.short.toLowerCase(), p.name.toLowerCase()].includes(String(v).trim().toLowerCase()))?.id;
  const findStage = v => STAGES.find(s => [s.id.toLowerCase(), s.name.toLowerCase()].includes(String(v).trim().toLowerCase()))?.id;
  const findProject = v => state.projects.find(p => p.id === v || p.name.toLowerCase() === String(v).trim().toLowerCase())?.id;
  let added = 0, updated = 0;
  rows.slice(1).forEach(r => {
    const g = k => C[k] >= 0 ? (r[C[k]] || '').trim() : '';
    if (!g('title')) return;
    const data = { title: g('title') };
    if (findProject(g('project'))) data.project = findProject(g('project'));
    if (g('platform')) data.platform = g('platform');
    if (findStage(g('stage'))) data.stage = findStage(g('stage'));
    if (g('sub')) data.sub = g('sub');
    if (findPerson(g('pic'))) data.pic = findPerson(g('pic'));
    if (PRIORITIES.includes(g('priority'))) data.priority = g('priority');
    if (g('start')) data.start = normDate(g('start'));
    if (g('due')) data.due = normDate(g('due'));
    if (g('output')) data.output = g('output');
    const st = [...GEN_STATUS, ...LCI_STATUS].find(s => s.toLowerCase() === g('status').toLowerCase());
    const ex = (g('id') && getTask(g('id'))) || state.tasks.find(t => t.title.toLowerCase() === data.title.toLowerCase());
    if (ex) {
      if (st && !(GATE_REQUIRED.includes(st) && ex.gate !== 'Lolos')) data.status = st;
      Object.assign(ex, data, { updatedAt: Date.now() }); updated++;
    } else {
      const stage = data.stage || 'A';
      const t = { id: nextTaskId(), project: state.projects[0].id, platform: platforms()[0], stage, sub: STAGE[stage].subs[0], detail: '', pic: me(), support: [], priority: 'Medium', start: off(0), due: off(7), status: 'Backlog', output: '', gate: 'Belum', deps: [], issue: '', evidence: [], notes: '', assignedBy: me(), cycle: 1, decision: '', createdAt: Date.now(), updatedAt: Date.now(), subtasks: [], comments: [], gateLog: [], ...data };
      if (st && !GATE_REQUIRED.includes(st) && statusesFor(t).includes(st)) t.status = st;
      state.tasks.push(t); added++;
    }
  });
  state.settings.lastSync = Date.now(); save('tasks'); save('settings');
  logAct('system', 'Sinkronisasi', `Dari ${source}: ${added} baru, ${updated} diperbarui`);
  refresh(); toast(`Sinkron selesai: ${added} baru, ${updated} diperbarui`, { icon: 'sync' });
}

/* =========================================================
   PIN LOCK
   ========================================================= */
function showLock() {
  $('#lock').classList.remove('hidden'); $('#lock-err').classList.add('hidden'); $('#lock-pin').value = '';
  setTimeout(() => $('#lock-pin').focus(), 50);
}
$('#lock-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (await hashPin($('#lock-pin').value) === state.settings.pinHash) { SS.set('unlocked', '1'); $('#lock').classList.add('hidden'); }
  else { $('#lock-err').classList.remove('hidden'); const f = $('#lock-form'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); $('#lock-pin').value = ''; }
});

/* =========================================================
   GLOBAL EVENT LISTENERS
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-nav]');
  if (!el || el.disabled) return;
  if (el.dataset.nav) { go(el.dataset.nav); return; }
  const fn = ACTS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form]?.(new FormData(f), f);
});
$('#modal-form').addEventListener('submit', e => {
  e.preventDefault();
  if (modalHandler && modalHandler(new FormData(e.target)) !== false) closeModal();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'note-title' || t.id === 'note-body') return noteInputChanged();
  if (t.id === 'note-search') { state.ui.noteQ = t.value; $('#note-list').innerHTML = noteListHtml(); return; }
  if (t.dataset.filter) { state.ui.f[t.dataset.filter] = t.value; if (t.tagName === 'SELECT') t.classList.toggle('border-blue-400', !!t.value); return renderTaskBody(); }
  if (t.id === 'log-search') { state.ui.logQ = t.value; return renderLogBody(); }
  if (t.id === 'comm-search') {
    state.ui.commQ = t.value;
    clearTimeout(t._tm); t._tm = setTimeout(() => { render(); const s = $('#comm-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250);
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  const t = getTask(state.ui.drawerId);
  if (el.dataset.field && t) {
    const f = el.dataset.field; let v = el.value;
    if (['title', 'detail', 'output', 'notes'].includes(f)) v = v.trim();
    if ((t[f] || '') === v) return;
    if (f === 'title' && !v) { el.value = t.title; return; }
    if (f === 'start' && v && t.due && v > t.due) { el.value = t.start; return deny('Start tidak boleh setelah deadline'); }
    if (f === 'due' && v && t.start && v < t.start) { el.value = t.due; return deny('Deadline tidak boleh sebelum start'); }
    const patch = { [f]: v };
    let detail = ['detail', 'output', 'notes'].includes(f) ? `${FIELD_LABEL[f]} diperbarui` : `${FIELD_LABEL[f]}: ${f === 'pic' ? pname(t[f]) : f === 'project' ? pjName(t[f]) : t[f] || '-'} → ${f === 'pic' ? pname(v) : f === 'project' ? pjName(v) : v || '-'}`;
    if (f === 'sub' && isLCI(t) !== (v === LCI_SUB)) { patch.status = v === LCI_SUB ? 'Ready to Input' : 'Backlog'; patch.gate = 'Belum'; detail += ` · status direset ke ${patch.status}`; }
    if (f === 'pic') patch.support = t.support.filter(x => x !== v);
    if (f === 'project') patch.cycle = getProject(v)?.cycle || 1;
    updateTask(t.id, patch, detail);
    return;
  }
  if (el.dataset.status !== undefined && t) { if (!setStatus(t, el.value)) el.value = t.status; return; }
  if (el.dataset.supportAdd !== undefined && t && el.value) { updateTask(t.id, { support: [...t.support, el.value] }, `Support ditambahkan: ${pname(el.value)}`); return; }
  if (el.dataset.depAdd !== undefined && t && el.value) {
    if (wouldCycle(t.id, el.value)) { el.value = ''; return deny('Dependency melingkar tidak diizinkan'); }
    updateTask(t.id, { deps: [...t.deps, el.value] }, `Dependency ditambahkan: ${el.value}`); return;
  }
  if (el.dataset.subStatus && t) {
    const s = t.subtasks.find(x => x.id === el.dataset.subStatus);
    if (!(s.pic === me() || can('work', t))) { el.value = s.status; return deny(); }
    const prev = s.status; s.status = el.value;
    updateTask(t.id, {}, `Sub-task "${s.title}": ${prev} → ${el.value}`); return;
  }
  if (el.id === 'm-stage') { $('#m-sub').innerHTML = opts(STAGE[el.value].subs, ''); return; }
  if (el.id === 'm-project') { const p = getProject(el.value); if (p) { $('#m-platform').value = p.platform; $('#m-stage').value = p.stage; $('#m-sub').innerHTML = opts(STAGE[p.stage].subs, ''); } return; }
  if (el.dataset.filterCheck) { state.ui.f[el.dataset.filterCheck] = el.checked; return renderTaskBody(); }
  if (el.dataset.ui) {
    state.ui[el.dataset.ui] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.ui === 'kanbanBy') LS.set('kanbanBy', el.value);
    return render();
  }
  if (el.dataset.daily) { const it = state.daily.items.find(x => x.id === el.dataset.daily); if (it) { it.done = el.checked; save('daily'); render(); } return; }
  if (el.dataset.setting === 'user') {
    const old = me(); state.settings.user = el.value; save('settings');
    state.ui.dashTab = null; state.ui.dashLead = null;
    logAct('system', 'Profil', `Profil aktif: ${pname(old)} → ${pname(el.value)}`);
    toast(`Masuk sebagai ${pname(el.value)} (${ROLE_LABEL[myRole()]})`, { icon: 'swap_horiz' }); refresh(); return;
  }
  if (el.dataset.settingNum) { const n = Math.max(1, Math.min(50, parseInt(el.value, 10) || 1)); state.settings[el.dataset.settingNum] = n; save('settings'); logAct('system', 'Pengaturan Master', `${el.dataset.settingNum} = ${n}`); toast('Ambang disimpan'); return; }
  if (el.id === 'import-file' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.tasks) || !Array.isArray(d.projects)) throw new Error('bukan cadangan ProductTrack v3');
        if (!confirm(`Impor ${d.projects.length} proyek & ${d.tasks.length} task? Data saat ini akan diganti.`)) return;
        ['projects', 'tasks', 'backlog', 'packages', 'bookmarks', 'notes', 'log'].forEach(k => { if (Array.isArray(d[k])) { state[k] = d[k]; save(k); } });
        if (d.settings) { Object.assign(state.settings, d.settings, { pinEnabled: state.settings.pinEnabled, pinHash: state.settings.pinHash, user: state.settings.user }); save('settings'); }
        logAct('system', 'Cadangan', `Impor ${d.tasks.length} task`); refresh(); toast('Cadangan diimpor');
      } catch (err) { deny('Gagal impor: ' + err.message); }
    };
    r.readAsText(el.files[0]); el.value = '';
  }
  if (el.id === 'csv-file' && el.files[0]) { const r = new FileReader(); r.onload = () => importCSV(String(r.result), 'file CSV'); r.readAsText(el.files[0]); el.value = ''; }
});

// Kanban drag & drop (status / pipeline LCI)
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('[data-drag-id]'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.dragId); e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => c.classList.add('opacity-40'), 0);
});
const clearDrop = () => $$('[data-drop]').forEach(z => z.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50'));
document.addEventListener('dragend', e => { e.target.closest?.('[data-drag-id]')?.classList.remove('opacity-40'); clearDrop(); });
document.addEventListener('dragover', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); clearDrop(); z.classList.add('ring-2', 'ring-blue-500', 'bg-blue-50');
});
document.addEventListener('drop', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); clearDrop();
  const t = getTask(e.dataTransfer.getData('text/plain'));
  if (t && t.status !== z.dataset.drop) { if (!setStatus(t, z.dataset.drop)) renderTaskBody(); }
});

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if (!$('#modal').classList.contains('hidden')) return closeModal();
    if (state.ui.drawerId) return closeDrawer();
    toggleSidebar(false);
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && state.ui.view === 'notes' && $('#note-title')) { e.preventDefault(); saveNote(); }
  if (e.key === '/' && !typing) { e.preventDefault(); $('#global-search').focus(); }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.name === 'text') { e.preventDefault(); e.target.form?.requestSubmit(); }
});
window.addEventListener('beforeunload', e => { if (state.ui.view === 'notes' && noteDirty()) { e.preventDefault(); e.returnValue = ''; } });

$('#global-search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if (getTask(q.toUpperCase())) { openDrawer(q.toUpperCase()); e.target.blur(); return; }
  goTasks({ q }); e.target.blur();
});

setInterval(() => {
  const busy = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!busy && $('#modal').classList.contains('hidden') && !(state.ui.view === 'notes' && noteDirty())) refresh();
}, 60000);

/* =========================================================
   INIT
   ========================================================= */
render();
if (state.settings.pinEnabled && state.settings.pinHash && SS.get('unlocked') !== '1') showLock();
</script>
</body>
