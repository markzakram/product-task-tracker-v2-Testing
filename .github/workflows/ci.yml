name: CI

# Gerbang sebelum apa pun dianggap beres. Nanti saat v2 pindah ke GitLab,
# isinya disalin ke .gitlab-ci.yml (tag runner: self-runner, seperti v1).

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Penjaga: kunci privat tak boleh ikut ter-commit. Kalau ini gagal, kuncinya
      # sudah terlanjur di riwayat git — menghapus berkasnya saja tidak cukup.
      # Polanya regex, bukan teks harfiah, supaya berkas ini tak menangkap dirinya sendiri.
      - name: Tak ada kunci privat di repo
        run: |
          if git grep -l -E -e "-----BEGIN [A-Z ]*PRIVATE KEY-----" -- . ; then
            echo "::error::Kunci privat ter-commit di berkas di atas."
            echo "Cabut kuncinya di Google Cloud (Service Accounts → Keys → hapus),"
            echo "buat kunci baru, lalu bersihkan riwayat git-nya."
            exit 1
          fi
          echo "Bersih."

      # npm install, bukan npm ci: lockfile sengaja tidak di-commit (lihat .gitignore).
      - run: npm install --no-audit --no-fund

      - run: npm test
